# Nizamlar Shop — yerel geliştirme altyapısı
# Kullanım:
#   docker compose up -d postgres redis            -> yalnızca altyapı (önerilen; backend/storefront host'ta çalışır)
#   docker compose --profile app up -d --build      -> backend + storefront dahil tüm yığın
# Değerler kökteki .env dosyasından okunur (bkz. .env.example).

name: nizamlar-shop

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nizamlar_shop}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-nizamlar_shop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:-medusa_dev_password}@postgres:5432/${POSTGRES_DB:-nizamlar_shop}
      REDIS_URL: redis://redis:6379
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  storefront:
    profiles: ["app"]
    build:
      context: ./storefront
      dockerfile: Dockerfile.dev
    env_file:
      - ./storefront/.env.local
    environment:
      # Sunucu tarafı (RSC) istekleri container ağı üzerinden backend'e gider
      MEDUSA_BACKEND_URL: http://backend:9000
    ports:
      - "8000:8000"
    volumes:
      - ./storefront:/app
      - storefront_node_modules:/app/node_modules
      - storefront_next:/app/.next
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  backend_node_modules:
  storefront_node_modules:
  storefront_next:
